name: Python regression tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Python test dependencies
        run: python -m pip install numpy pandas biopython -r requirements-metrics.txt
      - name: Prepare Rust toolchain
        run: rustup toolchain install stable --profile minimal
      - name: Test and build subcoli native library
        run: |
          cargo +stable test --locked --manifest-path subcoli_rs/Cargo.toml
          cargo +stable build --release --locked --manifest-path subcoli_rs/Cargo.toml
      - name: Verify Python can load the Rust backend
        run: python -B -c "import collinearity; assert collinearity.resolve_backend('rust') == 'rust'"
      - name: Run all tests with no skips allowed
        run: python -B tests/run_tests.py
